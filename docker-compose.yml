services:
  postgres:
    image: postgres:16-alpine
    container_name: peace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peace
      POSTGRES_PASSWORD: peace
      POSTGRES_DB: peace_seekers
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U peace -d peace_seekers']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: peace_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for media (Voice testimonies, avatars).
  # Production target is an EU-resident S3 bucket (see spec S-8).
  minio:
    image: minio/minio:latest
    container_name: peace_minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: peace
      MINIO_ROOT_PASSWORD: peace_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
