name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peace
          POSTGRES_PASSWORD: peace
          POSTGRES_DB: peace_seekers_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U peace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://peace:peace@localhost:5432/peace_seekers_test?schema=public
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      EMAIL_HASH_PEPPER: ci-only-email-pepper-0123456789abcdef
      IP_HASH_PEPPER: ci-only-ip-pepper-0123456789abcdefgh
      SESSION_SECRET: ci-only-session-secret-0123456789abcd
      MAIL_TRANSPORT: console
      MAIL_FROM: 'CI <ci@example.invalid>'
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: eu-central-1
      S3_BUCKET: peace-media
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci
      NEXT_PUBLIC_API_URL: http://localhost:4000/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @peace/shared
      - run: npx prisma generate --schema apps/api/prisma/schema

      # The migration has to apply cleanly from empty, including the
      # append-only triggers on the audit tables.
      - run: npm run db:deploy --workspace @peace/api

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks diffs a commit range, and the default shallow checkout
          # gives it none: it scanned zero bytes, reported no leaks, and exited
          # 1 — a secret scan that passes because it looked at nothing is worse
          # than no secret scan. Full history is also the scan worth having.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # S-11 — dependency and secret scanning on every change.
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every commit on main that passes the checks above goes to production.
  #
  # Railway is also connected to this repository and deploys main by itself, so
  # today that requirement is already met — but it deploys whatever is pushed,
  # tests or no tests. Deploying from here instead puts the build, the
  # typecheck, the tests, `npm audit --audit-level=high` and the secret scan in
  # front of production, which is the whole reason to do it from CI.
  #
  # Until RAILWAY_TOKEN exists the deploy steps skip and Railway's own
  # integration keeps shipping, so adding this file changed nothing and broke
  # nothing. Once the token is set, turn Railway's automatic deploy off in the
  # service settings — otherwise every push deploys twice.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify, security]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Is a deploy token configured?
        id: guard
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::RAILWAY_TOKEN is not set — leaving this commit to Railway'"'"'s own GitHub integration.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: 22
      - run: npm i -g @railway/cli
        if: steps.guard.outputs.configured == 'true'

      # The API first. The web app is server-rendered against it, so if a
      # release changes both, the one that answers should be up before the one
      # that asks.
      - name: Deploy API
        if: steps.guard.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service @peace/api --environment production --ci -m "${{ github.event.head_commit.message }}"

      - name: Deploy web
        if: steps.guard.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service @peace/web --environment production --ci -m "${{ github.event.head_commit.message }}"

      # Runs either way — whoever deployed this commit, the question is whether
      # production is answering. A green build is not a working site.
      - name: Smoke test production
        run: |
          set -euo pipefail
          api=https://api.peace-seekers.com/api/health/ready
          web=https://peace-seekers.com/en

          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "$api" 2>/dev/null || true)
            code=$(curl -o /dev/null -s -w '%{http_code}' --max-time 10 "$web" || true)
            if [ -n "$body" ] && [ "$code" = "200" ]; then
              echo "$body"
              # /health/ready, not /health: the shallow one answers "ok" from a
              # process that cannot reach Postgres, and an API in that state
              # serves an empty Wall — which looks like a working site.
              echo "$body" | grep -q '"database":"ok"' \
                && echo "$body" | grep -q '"cache":"ok"' \
                && { echo "production healthy after ${attempt} attempt(s)"; exit 0; }
            fi
            echo "attempt ${attempt}: api=$(echo "${body:-none}" | head -c 60) web=${code}"
            sleep 10
          done

          echo "::error::production did not come back healthy within 5 minutes"
          exit 1
