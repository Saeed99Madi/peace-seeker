name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peace
          POSTGRES_PASSWORD: peace
          POSTGRES_DB: peace_seekers_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U peace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://peace:peace@localhost:5432/peace_seekers_test?schema=public
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      EMAIL_HASH_PEPPER: ci-only-email-pepper-0123456789abcdef
      IP_HASH_PEPPER: ci-only-ip-pepper-0123456789abcdefgh
      SESSION_SECRET: ci-only-session-secret-0123456789abcd
      MAIL_TRANSPORT: console
      MAIL_FROM: 'CI <ci@example.invalid>'
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: eu-central-1
      S3_BUCKET: peace-media
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci
      NEXT_PUBLIC_API_URL: http://localhost:4000/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @peace/shared
      - run: npx prisma generate --schema apps/api/prisma/schema

      # The migration has to apply cleanly from empty, including the
      # append-only triggers on the audit tables.
      - run: npm run db:deploy --workspace @peace/api

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # S-11 — dependency and secret scanning on every change.
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
